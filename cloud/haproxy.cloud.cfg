# HAProxy no servidor da universidade.
# APP1_ADDR e APP2_ADDR vêm do .env gerado pelo cloud/deploy.sh.

global
    log stdout format raw local0
    maxconn 2000

# DNS interno do Docker
resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 10s

defaults
    mode http
    log global
    option httplog
    option forwardfor
    # se um servidor recusar a ligação, tenta noutro
    option redispatch
    retries 2
    timeout connect 3s
    timeout client  30s
    timeout server  30s
    timeout check   2s
    default-server check inter 2s fall 2 rise 2 init-addr last,libc,none resolvers docker

frontend http_front
    bind *:80
    # diz que servidor respondeu (demo D2)
    http-response set-header X-Servidor %s
    default_backend web_servers

frontend stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 2s
    stats auth "${STATS_USER}:${STATS_PASSWORD}"

backend web_servers
    balance roundrobin
    option httpchk GET /api/health
    http-check expect status 200
    server servidor1 "${APP1_ADDR}"
.if strneq("$APP2_ADDR","")
    server servidor2 "${APP2_ADDR}"
.endif
