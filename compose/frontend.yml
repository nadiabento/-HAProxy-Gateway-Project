# Frontend (NGINX + React). Fica na mesma rede do backend para o nginx
# conseguir encaminhar /api para http://backend:3000.
services:
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: clinica-frontend
    image: clinica-frontend:latest
    restart: unless-stopped
    ports:
      - "8080:80" # o HAProxy chega aqui; a firewall bloqueia o 8080 vindo de fora
    networks:
      - clinica_net

networks:
  clinica_net:
    name: clinica_net
