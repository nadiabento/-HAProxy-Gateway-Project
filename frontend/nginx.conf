server {
    listen 80;
    root /usr/share/nginx/html;       # onde estão os ficheiros do site
    index index.html;

    # DNS interno do Docker: deixa o NGINX arrancar mesmo sem o backend ligado
    resolver 127.0.0.11 valid=10s;

    # Tudo o que começa por /api vai para a API (contentor "backend", porta 3000)
    location /api/ {
        set $api http://backend:3000;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Verificação de estado, usada pelo HAProxy
    location = /healthz {
        default_type text/plain;
        return 200 'ok';
    }

    # Qualquer outro caminho devolve o index.html (a app React trata das rotas)
    location / {
        try_files $uri /index.html;
    }
}