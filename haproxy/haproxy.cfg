defaults
    mode http
    option forwardfor

frontend http_front
    bind *:80
    default_backend web_servers

frontend stats
    bind *:8404
    stats enable
    stats uri /stats

backend web_servers
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    server vm1 vm1:8080 check inter 2s fall 2 rise 2
    server vm2 vm2:8080 check inter 2s fall 2 rise 2