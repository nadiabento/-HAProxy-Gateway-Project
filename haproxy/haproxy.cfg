# Configuração partilhada pelos dois HAProxy de cada VM
global
    log stdout format raw local0

defaults
    mode http
    log global
    option httplog
    option forwardfor
    # tempos limite (sem eles o HAProxy avisa)
    timeout connect 5s
    timeout client 30s
    timeout server 30s

# Entrada: tudo o que chega à porta 80 vai para o backend web_servers
frontend http_front
    bind *:80
    default_backend web_servers

# Página de estatísticas
frontend stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 5s

# Balanceamento round-robin entre o frontend (NGINX) da vm1 e da vm2
backend web_servers
    balance roundrobin
    option httpchk GET /api/health
    http-check expect status 200
    server vm1 192.168.56.11:8080 check inter 2s fall 2 rise 2
    server vm2 192.168.56.12:8080 check inter 2s fall 2 rise 2

